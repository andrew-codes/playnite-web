type FilterItemValue {
  value: String!
  display: String!
  color: String
}

enum RelatedType {
  Release
  Platform
  Source
  Genre
  Publisher
  Developer
  Tag
  Playlist
  CriticScore
  CommunityScore
}

type FilterItem {
  name: String!
  field: String!
  allowedValues: [FilterItemValue!]!
  relatedType: RelatedType
}

extend type Query {
  filterItems: [FilterItem!]!
}
